spring.application.name=bank-backend
spring.docker.compose.file=./docker/docker-compose-dev.yaml
spring.docker.compose.lifecycle-management=start-only
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.tooling.schema.index_validation=named
spring.jpa.properties.hibernate.tooling.schema.unique_key_validation=named
spring.jackson.deserialization.accept-float-as-int=false
settlement.base-url=http://localhost:8083
transfer.recovery.fixed-delay=30000
receipt.recovery.fixed-delay=30000
