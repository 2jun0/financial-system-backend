name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [bank-backend, settlement-backend]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            ${{ matrix.project }}/*.gradle.kts
            ${{ matrix.project }}/gradle/wrapper/gradle-wrapper.properties
      - name: Run tests and lint
        run: ./gradlew test ktlintCheck --continue --no-daemon
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.project }}
          path: |
            ${{ matrix.project }}/build/reports/tests/test/
            ${{ matrix.project }}/build/test-results/test/
            ${{ matrix.project }}/build/reports/ktlint/
          if-no-files-found: warn
          retention-days: 7
